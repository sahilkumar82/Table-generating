<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: black;
            color: white;
        }

        .container {
            align-items: center;
            display: flex;
            justify-content: center;
            gap: 10px;

        }

        input {
            border: 2px solid white;
            border-radius: 10px;
            width: 300px;
            font-size: x-large;
            height: 40px;
            padding-left: 10px;

        }

        button {
            border: 2px solid white;
            border-radius: 10px;
            width: 150px;
            font-size: medium;
            height: 45px;
            padding-left: 10px;
        }

        h3 {
            text-align: center;
            font-size: xx-large;
        }
    </style>
</head>

<body>

    <div class="container">
        <input type="text" id="txt1" placeholder="Enter a number here">
        <button onclick="table()">Generate Table</button>
    </div>
    <h3 id="p1">
    </h3>
    <script>
        function table() {
            let num = document.getElementById('txt1').value;
            let result = '';
            for (let index = 1; index <= 10; index++) {
                result += num + " x " + index + " = " + num * index + "<br>";
            }
            document.getElementById('p1').innerHTML = result;
        }
    </script>
</body>

</html>
